  <defs>
    <polygon id="star" points="0,-38 11.2,-11.7 39.9,-11.7 16.7,5.2 25.5,32.3 0,15.5 -25.5,32.3 -16.7,5.2 -39.9,-11.7 -11.2,-11.7" fill="#000000"/>
