<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <polygon id="som-star" points="0,-38 11.2,-11.7 39.9,-11.7 16.7,5.2 25.5,32.3 0,15.5 -25.5,32.3 -16.7,5.2 -39.9,-11.7 -11.2,-11.7" fill="#000000"/>
  </defs>
  <!-- Top Stripe: Green -->
  <rect x="0" y="0" width="600" height="133.33" fill="#128043"/>
  <!-- Arabic Shahada Calligraphy -->
  <g fill="#FFFFFF" text-anchor="middle">
    <text x="300" y="84" font-family="'Scheherazade New', 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', sans-serif" font-size="46" font-weight="700" letter-spacing="1px">لَا إِلٰهَ إِلَّا الله مُحَمَّدٌ رَسُولُ الله</text>
  </g>
  <!-- Middle Stripe: White -->
  <rect x="0" y="133.33" width="600" height="133.33" fill="#FFFFFF"/>
  <!-- Black 5-pointed Star in Center -->
  <g transform="translate(300, 200)">
    <use href="#som-star"/>
  </g>
  <!-- Bottom Stripe: Red -->
  <rect x="0" y="266.66" width="600" height="133.34" fill="#D21034"/>
</svg>
